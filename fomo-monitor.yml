name: FOMO 24/7 Monitor

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test ntfy notification"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test ntfy notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification == true }}
        env:
          FOMO_NTFY_TOPIC: ${{ secrets.FOMO_NTFY_TOPIC }}
        run: |
          if [ -z "$FOMO_NTFY_TOPIC" ]; then
            echo "FOMO_NTFY_TOPIC secret is missing"
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Title: 🔥 FOMO 24/7 Monitor Test" \
            -H "Priority: 4" \
            -H "Tags: white_check_mark" \
            -d "GitHub Actions → ntfy is working. $(date -u)" \
            "https://ntfy.sh/$FOMO_NTFY_TOPIC"

      - name: Run FOMO monitor
        env:
          FOMO_NTFY_TOPIC: ${{ secrets.FOMO_NTFY_TOPIC }}
        run: python monitor.py

      - name: Commit monitor data
        run: |
          git config user.name "FOMO Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/state.json
          if git diff --cached --quiet; then
            echo "No monitor data changes to commit."
          else
            git commit -m "Update FOMO 24/7 monitor data"
            git push
          fi
