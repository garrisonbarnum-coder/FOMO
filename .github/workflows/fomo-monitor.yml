name: FOMO 24/7 Monitor

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test push notification to the configured phone"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "7/5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    env:
      FOMO_NTFY_TOPIC: ${{ secrets.FOMO_NTFY_TOPIC }}
      FOMO_TEST_NOTIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification || false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test ntfy connection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification }}
        env:
          FOMO_NTFY_TOPIC: ${{ secrets.FOMO_NTFY_TOPIC }}
        run: |
          if [ -z "$FOMO_NTFY_TOPIC" ]; then
            echo "FOMO_NTFY_TOPIC is not configured."
            exit 1
          fi
          echo "Sending direct ntfy test."
          curl --fail --silent --show-error \
            -X POST \
            -H "Title: FOMO GitHub Test" \
            -H "Priority: 5" \
            -H "Tags: white_check_mark,rocket" \
            --data "GitHub Actions can reach ntfy. Jarvis push path is working." \
            "https://ntfy.sh/$FOMO_NTFY_TOPIC"
      - name: Run FOMO monitor
        run: python monitor.py

      - name: Commit monitoring data
        run: |
          git config user.name "FOMO Monitor"
          git config user.email "fomo-monitor@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update FOMO monitoring data"
          git push
